<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
    <linearGradient id="bag" x1="8" y1="10" x2="24" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="chart" x1="10" y1="25" x2="26" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>
  <!-- Bag handle -->
  <path d="M12.5 12 C12.5 9 19.5 9 19.5 12" stroke="url(#bag)" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <!-- Bag body -->
  <rect x="8" y="12" width="16" height="13" rx="2.5" fill="url(#bag)" opacity="0.9"/>
  <!-- Chart bars inside bag -->
  <rect x="11" y="21" width="2.2" height="2.5" rx="0.5" fill="#0a0a0a" opacity="0.7"/>
  <rect x="14.4" y="19" width="2.2" height="4.5" rx="0.5" fill="#0a0a0a" opacity="0.7"/>
  <rect x="17.8" y="17" width="2.2" height="6.5" rx="0.5" fill="#0a0a0a" opacity="0.7"/>
</svg>
